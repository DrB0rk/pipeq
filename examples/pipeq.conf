# PipeQ example: a 10-band stereo parametric EQ using PipeWire's builtin biquad filters.
# Copy this file to ~/.config/pipewire/pipewire.conf.d/ and restart the user PipeWire service.
# PipeQ changes the eqN:Freq, eqN:Gain and eqN:Q controls live through pw-cli.

context.modules = [
{
  name = libpipewire-module-filter-chain
  args = {
    node.description = "PipeQ Equalizer"
    media.name = "PipeQ Equalizer"

    filter.graph = {
      nodes = [
        { type = builtin name = preamp label = linear control = { Mult = 1.0 Add = 0.0 } }
        { type = builtin name = bass label = bq_lowshelf control = { Freq = 120 Q = 0.7 Gain = 0.0 } }
        { type = builtin name = bass_trim label = linear control = { Mult = 1.0 Add = 0.0 } }
        { type = builtin name = eq1  label = bq_peaking control = { Freq = 32    Q = 0.7 Gain = 0.0 } }
        { type = builtin name = eq2  label = bq_peaking control = { Freq = 64    Q = 0.7 Gain = 0.0 } }
        { type = builtin name = eq3  label = bq_peaking control = { Freq = 125   Q = 0.7 Gain = 0.0 } }
        { type = builtin name = eq4  label = bq_peaking control = { Freq = 250   Q = 0.7 Gain = 0.0 } }
        { type = builtin name = eq5  label = bq_peaking control = { Freq = 500   Q = 0.7 Gain = 0.0 } }
        { type = builtin name = eq6  label = bq_peaking control = { Freq = 1000  Q = 0.7 Gain = 0.0 } }
        { type = builtin name = eq7  label = bq_peaking control = { Freq = 2000  Q = 0.7 Gain = 0.0 } }
        { type = builtin name = eq8  label = bq_peaking control = { Freq = 4000  Q = 0.7 Gain = 0.0 } }
        { type = builtin name = eq9  label = bq_peaking control = { Freq = 8000  Q = 0.7 Gain = 0.0 } }
        { type = builtin name = eq10 label = bq_peaking control = { Freq = 16000 Q = 0.7 Gain = 0.0 } }
      ]

      links = [
        { output = "preamp:Out" input = "bass:In" }
        { output = "bass:Out" input = "eq1:In" }
        { output = "eq1:Out"  input = "eq2:In" }
        { output = "eq2:Out"  input = "eq3:In" }
        { output = "eq3:Out"  input = "eq4:In" }
        { output = "eq4:Out"  input = "eq5:In" }
        { output = "eq5:Out"  input = "eq6:In" }
        { output = "eq6:Out"  input = "eq7:In" }
        { output = "eq7:Out"  input = "eq8:In" }
        { output = "eq8:Out"  input = "eq9:In" }
        { output = "eq9:Out"  input = "eq10:In" }
        { output = "eq10:Out" input = "bass_trim:In" }
      ]

    }

    capture.props = {
      node.name = "effect_input.pipeq"
      media.class = Audio/Sink
      audio.channels = 2
      audio.position = [ FL FR ]
    }

    playback.props = {
      node.name = "effect_output.pipeq"
      node.passive = true
      audio.channels = 2
      audio.position = [ FL FR ]
    }
  }
}
]
